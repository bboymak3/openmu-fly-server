name: Vigilante de BarrioMU

# Cada hora entra al juego como un jugador (scripts/vigilante.js), da una vuelta
# por la ciudad y se va. Si falla abre un aviso (issue) que llega a la app de
# GitHub; cuando vuelve a funcionar lo cierra.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Minutos paseando en la ciudad (0-20)'
        default: '1'

permissions:
  contents: read
  issues: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar el navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Entrar al juego
        id: vigia
        continue-on-error: true
        env:
          VIGIA_USUARIO: ${{ secrets.VIGIA_USUARIO }}
          VIGIA_CLAVE: ${{ secrets.VIGIA_CLAVE }}
          VIGIA_MINUTOS: ${{ github.event.inputs.minutos || '1' }}
        run: node scripts/vigilante.js

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigilante-capturas
          path: vigilante-capturas/
          retention-days: 3
          if-no-files-found: ignore

      - name: Avisar
        if: always()
        uses: actions/github-script@v7
        env:
          RESULTADO: ${{ steps.vigia.outcome }}
        with:
          script: |
            const fs = require('fs');
            const leer = f => { try { return fs.readFileSync(f, 'utf8').trim(); } catch { return ''; } };
            const ok = process.env.RESULTADO === 'success';
            const reporte = leer('vigilante-capturas/reporte.md');
            const motivo = leer('vigilante-capturas/motivo.txt') || 'el vigilante no terminó';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const hora = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const label = 'vigilante';
            try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205' }); } catch {}
            const { data: abiertos } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            const aviso = abiertos[0];
            if (!ok) {
              const cuerpo = `@${context.repo.owner} el vigilante no pudo jugar.\n\n**Motivo:** ${motivo}\n\n**Última revisión:** ${hora}\n\n${reporte}\n\nCapturas y detalle: ${run}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
              if (aviso) {
                // Ya avisó: solo pone al día el texto (no vuelve a sonar cada hora).
                await github.rest.issues.update({ ...context.repo, issue_number: aviso.number, body: cuerpo });
              } else {
                await github.rest.issues.create({ ...context.repo, title: `🔴 BarrioMU con problemas: ${motivo}`.slice(0, 200), body: cuerpo, labels: [label] });
              }
              core.setFailed(motivo);
            } else if (aviso) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: aviso.number, body: `✅ Volvió a funcionar (${hora}).\n\n${reporte}\n\n${run}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_` });
              await github.rest.issues.update({ ...context.repo, issue_number: aviso.number, state: 'closed', state_reason: 'completed' });
            }
