name: Compilar OpenMU para ARM64 (tablet Android)

# Compila OpenMU para linux-arm64 (Ubuntu dentro de Termux/proot-distro)
# y publica el zip en Releases: tag "openmu-arm64" desde main y "openmu-arm64-test" desde
# cualquier otra rama (se prueba en la tablet antes de fusionar).
# Es self-contained: en la tablet no hace falta instalar .NET.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-arm64.yml
      - openmu-barrio/**

permissions:
  contents: write

# Una compilacion a la vez: dos seguidas no deben pisarse el Release.
concurrency:
  group: openmu-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version fija de OpenMU: la que ya se probo en la tablet. Para cambiarla,
      # poner otro commit aqui y revisar que los parches de openmu-barrio apliquen.
      - name: Descargar codigo de OpenMU
        env:
          OPENMU_COMMIT: b15148ea9f5dc6ea49b86224800a8e6608262457
        run: |
          git init -q openmu
          git -C openmu fetch -q --depth 1 https://github.com/MUnique/OpenMU.git "$OPENMU_COMMIT"
          git -C openmu checkout -q FETCH_HEAD

      - name: Personalizar BarrioMU
        run: |
          S=openmu/src
          T=$S/Persistence/Initialization/VersionSeasonSix/TestAccounts
          # Cuentas barrio01..barrio10 en lugar de las de prueba (test0, testgm, ...)
          cp openmu-barrio/TestAccountsInitialization.cs openmu-barrio/BarrioAccount.cs $T/
          # Premio diario de zen, Master Reset, NPCs de buff en Lorencia (Guerrero y Fortuna)
          # y NPCs de las ciudades (tiendas, baul...) si faltan
          cp openmu-barrio/BarrioDailyRewardPlugIn.cs openmu-barrio/BarrioStore.cs \
             openmu-barrio/BarrioMasterResetPlugIn.cs openmu-barrio/BarrioBuffNpcsPlugIn.cs \
             openmu-barrio/BarrioTownNpcsPlugIn.cs openmu-barrio/BarrioStarterSetPlugIn.cs \
             openmu-barrio/BarrioPointsPlugIn.cs openmu-barrio/BarrioOnlineNpcPlugIn.cs \
             openmu-barrio/BarrioSabioPlugIn.cs openmu-barrio/BarrioAvisosPlugIn.cs \
             openmu-barrio/BarrioSpotsPlugIn.cs openmu-barrio/BarrioOfflineRespawnPolicy.cs \
             openmu-barrio/BarrioMascotasPlugIn.cs openmu-barrio/BarrioGrantSabioPlugIn.cs \
             openmu-barrio/BarrioSabioProteccionPlugIn.cs $S/GameLogic/PlugIns/
          # Spots de farmeo: quien farmea con /offlevel en un spot sigue al revivir (BarrioSpots decide)
          sed -i 's/public virtual bool RespawnAndContinue => false;/public virtual bool RespawnAndContinue => OfflineRespawnPolicy.ShouldContinue?.Invoke(this) ?? false;/' $S/GameLogic/Offline/OfflinePlayer.cs
          # 2 game servers con nombre propio
          sed -i 's/CreateInitialDataAsync(3, true)/CreateInitialDataAsync(2, true)/' $S/Startup/Program.cs
          sed -i 's/server.Description = \$"Server {i}";/server.Description = i switch { 0 => "MIJAGUA", 1 => "ALTOBARINAS", _ => $"Server {i}" };/' $S/Persistence/Initialization/DataInitializationBase.cs
          # MIJAGUA con PvP, ALTOBARINAS sin PvP (en una base de datos nueva)
          sed -i 's/server.ExperienceRate = 1.0f;/server.ExperienceRate = 1.0f;\n            server.PvpEnabled = i != 1;/' $S/Persistence/Initialization/DataInitializationBase.cs
          # ALTOBARINAS con doble drop; Fortuna duplica el drop de quien tenga su buff
          git -C openmu apply ../openmu-barrio/doble-drop.patch
          # Cada Master Reset suma sus puntos extra a cada reset
          git -C openmu apply ../openmu-barrio/master-reset.patch
          # Todos los jugadores llegan por el proxy desde 127.0.0.1: sin limite por IP
          sed -i 's/this.CheckMaxConnectionsPerAddress = true;/this.CheckMaxConnectionsPerAddress = false;/' $S/DataModel/Configuration/ConnectServerDefinition.cs
          grep -c 'CreateInitialDataAsync(2, true)' $S/Startup/Program.cs
          grep -c 'MIJAGUA' $S/Persistence/Initialization/DataInitializationBase.cs
          grep -c 'CheckMaxConnectionsPerAddress = false' $S/DataModel/Configuration/ConnectServerDefinition.cs
          grep -c 'PvpEnabled = i != 1' $S/Persistence/Initialization/DataInitializationBase.cs
          grep -c 'DropRateMultiplier' $S/GameServer/GameServer.cs
          grep -c 'FortunaEffectNumber' $S/GameLogic/DefaultDropGenerator.cs
          grep -c 'BarrioMasterResetPlugIn.BonusPoints' $S/GameLogic/Resets/ResetCharacterAction.cs
          grep -c 'OfflineRespawnPolicy.ShouldContinue' $S/GameLogic/Offline/OfflinePlayer.cs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar para linux-arm64
        working-directory: openmu
        run: |
          dotnet publish src/Startup/MUnique.OpenMU.Startup.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -p:ci=true \
            -o ../out

      - name: Agregar script de inicio
        run: |
          cat > out/iniciar.sh <<'EOF'
          #!/bin/bash
          # Uso: ./iniciar.sh            -> modo demo (no guarda nada)
          #      ./iniciar.sh -autostart -> con PostgreSQL
          cd "$(dirname "$0")"
          export ASPNETCORE_URLS="${ASPNETCORE_URLS:-http://+:8080}"
          export DOTNET_GCHeapHardLimit="${DOTNET_GCHeapHardLimit:-1C0000000}"
          if [ $# -eq 0 ]; then
            set -- -demo -resolveIP:local
          fi
          exec ./MUnique.OpenMU.Startup "$@"
          EOF
          chmod +x out/iniciar.sh out/MUnique.OpenMU.Startup

      - name: Crear zip
        run: cd out && zip -qr ../openmu-linux-arm64.zip .

      # GitHub no deja crear la etiqueta openmu-arm64 sobre esta rama: se crea sobre main
      # (solo es una marca) si falta, y se reemplazan los archivos del Release.
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPENMU_COMMIT=$(git -C openmu rev-parse --short HEAD)
          # main publica la version de PRODUCCION (openmu-arm64). Cualquier otra rama publica solo
          # la de PRUEBA (openmu-arm64-test): un cambio sin probar en la tablet nunca pisa lo que
          # baja `barriomu.sh openmu actualizar`. Para probarla: `barriomu.sh openmu actualizar prueba`.
          if [ "$GITHUB_REF_NAME" = main ]; then TAG=openmu-arm64; PRE=""; else TAG=openmu-arm64-test; PRE="--prerelease"; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $PRE \
              --title "OpenMU linux-arm64 ($TAG)" \
              --notes "Compilado desde MUnique/OpenMU commit ${OPENMU_COMMIT}."
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Compilado desde MUnique/OpenMU commit ${OPENMU_COMMIT}. Rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}."
          gh release upload "$TAG" openmu-linux-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber
