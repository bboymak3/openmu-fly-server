name: Compilar OpenMU para ARM64 (tablet Android)

# Compila OpenMU para linux-arm64 (Ubuntu dentro de Termux/proot-distro)
# y publica el zip en Releases con el tag "openmu-arm64".
# Es self-contained: en la tablet no hace falta instalar .NET.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-arm64.yml
      - openmu-barrio/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version fija de OpenMU: la que ya se probo en la tablet. Para cambiarla,
      # poner otro commit aqui y revisar que los parches de openmu-barrio apliquen.
      - name: Descargar codigo de OpenMU
        env:
          OPENMU_COMMIT: b15148ea9f5dc6ea49b86224800a8e6608262457
        run: |
          git init -q openmu
          git -C openmu fetch -q --depth 1 https://github.com/MUnique/OpenMU.git "$OPENMU_COMMIT"
          git -C openmu checkout -q FETCH_HEAD

      - name: Personalizar BarrioMU
        run: |
          S=openmu/src
          T=$S/Persistence/Initialization/VersionSeasonSix/TestAccounts
          # Cuentas barrio01..barrio10 en lugar de las de prueba (test0, testgm, ...)
          cp openmu-barrio/TestAccountsInitialization.cs openmu-barrio/BarrioAccount.cs $T/
          # 2 game servers con nombre propio
          sed -i 's/CreateInitialDataAsync(3, true)/CreateInitialDataAsync(2, true)/' $S/Startup/Program.cs
          sed -i 's/server.Description = \$"Server {i}";/server.Description = i switch { 0 => "MIJAGUA", 1 => "ALTOBARINAS", _ => $"Server {i}" };/' $S/Persistence/Initialization/DataInitializationBase.cs
          # MIJAGUA con PvP, ALTOBARINAS sin PvP (en una base de datos nueva)
          sed -i 's/server.ExperienceRate = 1.0f;/server.ExperienceRate = 1.0f;\n            server.PvpEnabled = i != 1;/' $S/Persistence/Initialization/DataInitializationBase.cs
          # ALTOBARINAS con doble drop
          git -C openmu apply ../openmu-barrio/doble-drop.patch
          # Todos los jugadores llegan por el proxy desde 127.0.0.1: sin limite por IP
          sed -i 's/this.CheckMaxConnectionsPerAddress = true;/this.CheckMaxConnectionsPerAddress = false;/' $S/DataModel/Configuration/ConnectServerDefinition.cs
          grep -c 'CreateInitialDataAsync(2, true)' $S/Startup/Program.cs
          grep -c 'MIJAGUA' $S/Persistence/Initialization/DataInitializationBase.cs
          grep -c 'CheckMaxConnectionsPerAddress = false' $S/DataModel/Configuration/ConnectServerDefinition.cs
          grep -c 'PvpEnabled = i != 1' $S/Persistence/Initialization/DataInitializationBase.cs
          grep -c 'DropRateMultiplier' $S/GameServer/GameServer.cs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar para linux-arm64
        working-directory: openmu
        run: |
          dotnet publish src/Startup/MUnique.OpenMU.Startup.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -p:ci=true \
            -o ../out

      - name: Agregar script de inicio
        run: |
          cat > out/iniciar.sh <<'EOF'
          #!/bin/bash
          # Uso: ./iniciar.sh            -> modo demo (no guarda nada)
          #      ./iniciar.sh -autostart -> con PostgreSQL
          cd "$(dirname "$0")"
          export ASPNETCORE_URLS="${ASPNETCORE_URLS:-http://+:8080}"
          export DOTNET_GCHeapHardLimit="${DOTNET_GCHeapHardLimit:-1C0000000}"
          if [ $# -eq 0 ]; then
            set -- -demo -resolveIP:local
          fi
          exec ./MUnique.OpenMU.Startup "$@"
          EOF
          chmod +x out/iniciar.sh out/MUnique.OpenMU.Startup

      - name: Crear zip
        run: cd out && zip -qr ../openmu-linux-arm64.zip .

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPENMU_COMMIT=$(git -C openmu rev-parse --short HEAD)
          gh release delete openmu-arm64 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create openmu-arm64 openmu-linux-arm64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenMU linux-arm64" \
            --notes "Compilado desde MUnique/OpenMU commit ${OPENMU_COMMIT}."
